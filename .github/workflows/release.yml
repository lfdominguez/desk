name: Build

# Every push to main builds the .deb, the AppImage, the macOS zip and the Windows zip and MSI
# as workflow artifacts
# (pull requests run ci.yml instead);
# a release tag also publishes them as a GitHub release. Releases are dated:
# 2026.11.03, and a later one the same day 2026.11.03.1, .2…
on:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

# one run per ref at a time: two pushes to main mustn't both rebuild nightly
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      CGO_CFLAGS_ALLOW: -fno-strict-overflow
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A release's notes are its section in CHANGELOG.md ("## [<tag>] - <date>"):
      # a tag without one fails here, before anything is built.
      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::no '## [$GITHUB_REF_NAME]' section: write the release's notes there before tagging"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev libpipewire-0.3-dev libfuse2t64 librsvg2-bin

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            v="$GITHUB_REF_NAME"
            # YYYY.MM.DD, a real date, then .N (1, 2…) for another release that day
            if ! [[ "$v" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(\.[1-9][0-9]*)?$ ]] ||
               [[ "$(date -ud "${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}" +%Y.%m.%d 2>/dev/null)" != "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" ]]; then
              echo "::error::tag $v is not a release version: YYYY.MM.DD or YYYY.MM.DD.N"
              exit 1
            fi
          else
            # between releases: today's date and the commit; ~ sorts before the release itself in dpkg
            v="$(date -u +%Y.%m.%d)~git$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go build -tags nox11 -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/desk ./cmd/desk

      - name: Check the version
        run: '[[ "$(dist/desk --version)" == "desk $VERSION" ]]'

      - name: .deb
        run: |
          root=dist/deb
          install -Dm755 dist/desk $root/usr/bin/desk
          install -Dm644 packaging/desk.desktop $root/usr/share/applications/desk.desktop
          install -Dm644 packaging/desk.svg $root/usr/share/icons/hicolor/scalable/apps/desk.svg
          install -Dm644 LICENSE $root/usr/share/doc/desk/copyright
          mkdir -p $root/DEBIAN
          cat > $root/DEBIAN/control <<EOF
          Package: desk
          Version: $VERSION
          Architecture: amd64
          Maintainer: Luis Felipe Domínguez Vega <ldominguezvega@gmail.com>
          Homepage: https://github.com/lfdominguez/desk
          Depends: libc6, libwayland-client0, libwayland-cursor0, libwayland-egl1, libegl1, libxkbcommon0, libpipewire-0.3-0t64 | libpipewire-0.3-0
          Recommends: bubblewrap, openssh-client
          Section: devel
          Priority: optional
          Description: A Kanban board where every card is a Claude Code session
           desk runs a Claude Code session per card, in its organization's folder and account,
           and tracks the pull requests, tickets, CI and alerts the work depends on.
          EOF
          dpkg-deb --root-owner-group --build $root "dist/desk_${VERSION}_amd64.deb"

      - name: AppImage
        run: |
          app=dist/desk.AppDir
          install -Dm755 dist/desk $app/usr/bin/desk
          install -Dm644 packaging/desk.desktop $app/desk.desktop
          # .DirIcon must be a PNG: file managers and thumbnailers don't read SVG
          rsvg-convert -w 256 -h 256 packaging/desk.svg -o $app/desk.png
          ln -s desk.png $app/.DirIcon
          ln -s usr/bin/desk $app/AppRun
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool $app "dist/desk-${VERSION}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}
          path: |
            dist/*.deb
            dist/*.AppImage

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "desk $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" dist/*.deb dist/*.AppImage

      # Every push to main replaces the rolling "nightly" pre-release (and
      # moves its tag to this commit); dated tags stay the real releases.
      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "desk nightly ($VERSION)" \
            --notes "Built from main at $GITHUB_SHA. Replaced on every push; for a stable version take a dated release." \
            dist/*.deb dist/*.AppImage

  # desk.app for macOS (universal: arm64 + x86_64) as desk-<version>-macos.zip, built by
  # packaging/macos/build-app.sh with the package job's version, then added to the release
  # (or nightly) that job made. Ad-hoc signed, so Gatekeeper asks on first open. With the
  # APPLE_* secrets it is signed with a Developer ID and notarized instead:
  #   APPLE_CERTIFICATE_P12       base64 of the "Developer ID Application" certificate (.p12)
  #   APPLE_CERTIFICATE_PASSWORD  that .p12's password
  #   APPLE_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
  #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  notarytool's login (an app-specific password)
  macos:
    needs: package
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.package.outputs.version }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Optional: only with the owner's Developer ID certificate
      - name: Signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "" "$kc"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$kc"
          # shellcheck disable=SC2046 # the search list is split on purpose: one keychain per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$APPLE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: desk.app
        run: packaging/macos/build-app.sh

      - name: Check the version
        run: '[[ "$(dist/desk.app/Contents/MacOS/desk --version)" == "desk $VERSION" ]]'

      # Optional: only with the certificate and notarytool's login; staples the ticket and zips again
      - name: Notarize
        if: env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        run: |
          zip="dist/desk-$VERSION-macos.zip"
          xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/desk.app
          rm "$zip"
          ditto -c -k --keepParent dist/desk.app "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-macos
          path: dist/*.zip

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip

      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly --clobber dist/*.zip

  # desk for Windows (amd64): desk-<version>-windows-amd64.zip (portable), cross-built on Linux by
  # packaging/windows/build.sh (Gio needs no cgo there) with the package job's version, then added
  # to the release (or nightly) that job made; the MSI's inputs go on to windows-msi. Unsigned, so
  # SmartScreen warns on first run. With these secrets desk.exe (here, osslsigncode) and the MSI
  # (there, signtool) are Authenticode-signed instead:
  #   WINDOWS_CERT_PFX       base64 of the code signing certificate with its key (.pfx)
  #   WINDOWS_CERT_PASSWORD  that .pfx's password
  windows:
    needs: package
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.package.outputs.version }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick zip osslsigncode

      # Optional: only with the owner's code signing certificate
      - name: Signing certificate
        if: env.WINDOWS_CERT_PFX != ''
        run: |
          echo "$WINDOWS_CERT_PFX" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          echo "SIGN_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          echo "SIGN_PASSWORD=$WINDOWS_CERT_PASSWORD" >> "$GITHUB_ENV"

      - name: desk.exe, zip and the MSI's inputs
        run: packaging/windows/build.sh

      - name: Check the version
        run: grep -qaF "$VERSION" dist/windows/desk.exe

      - name: Forget the certificate
        if: always() && env.WINDOWS_CERT_PFX != ''
        run: rm -f "$RUNNER_TEMP/cert.pfx"

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-windows
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-windows-msi-inputs
          path: dist/windows/msi

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip

      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly --clobber dist/*.zip

  # desk's MSI, on Windows: WiX v5's wizard (WixUI_Advanced) doesn't build elsewhere. From the
  # windows job's desk.exe and inputs by packaging/windows/msi.ps1; signed with the same secrets;
  # then installed silently (per user), checked and uninstalled before it's published.
  windows-msi:
    needs: [package, windows]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.package.outputs.version }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-windows-msi-inputs
          path: msi

      - name: WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: MSI
        run: ./msi/msi.ps1 "desk-$env:VERSION-windows-amd64.msi"

      # Optional: only with the owner's code signing certificate
      - name: Sign
        if: env.WINDOWS_CERT_PFX != ''
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          try {
            & $st.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /d desk `
              /tr http://timestamp.digicert.com /td sha256 "desk-$env:VERSION-windows-amd64.msi"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item $pfx }

      # As a user without the wizard would: per user, on the user's PATH, gone after uninstall
      - name: Try it
        run: |
          $msi = "desk-$env:VERSION-windows-amd64.msi"
          $p = Start-Process msiexec -ArgumentList '/i', $msi, '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content install.log -Tail 80; exit $p.ExitCode }
          $exe = "$env:LOCALAPPDATA\Apps\desk\desk.exe"
          if (-not (Test-Path $exe)) {
            Select-String install.log -Pattern 'APPLICATIONFOLDER|ALLUSERS' | Select-Object -Last 20
            throw "desk.exe isn't in $exe"
          }
          if ([Environment]::GetEnvironmentVariable('PATH', 'User') -notlike '*Apps\desk*') { throw "not on the user's PATH" }
          $p = Start-Process msiexec -ArgumentList '/x', $msi, '/qn' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path $exe)) { throw "uninstall left $exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-windows-msi
          path: desk-*.msi

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "desk-$env:VERSION-windows-amd64.msi" --repo "$env:GITHUB_REPOSITORY"

      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly --clobber "desk-$env:VERSION-windows-amd64.msi" --repo "$env:GITHUB_REPOSITORY"

  # The AUR package desk-kanban, from packaging/aur/PKGBUILD with this tag's
  # version and source checksum. Needs the AUR_SSH_PRIVATE_KEY secret (the
  # key of the AUR account that maintains it); without it the job says so.
  aur:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version and checksum
        id: pkg
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::warning::no AUR_SSH_PRIVATE_KEY secret: the AUR package is not published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v="$GITHUB_REF_NAME"
          sum=$(curl -fsSL "https://github.com/lfdominguez/desk/archive/refs/tags/$v.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$v/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/PKGBUILD
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.pkg.outputs.publish == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: desk-kanban
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: Luis Felipe Domínguez Vega
          commit_email: ldominguezvega@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: desk ${{ github.ref_name }}
          updpkgsums: false
