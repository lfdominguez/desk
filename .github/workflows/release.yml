name: Build

# Every push to main builds the .deb, the AppImage, the macOS zip and the Windows zip and MSI
# as workflow artifacts
# (pull requests run ci.yml instead);
# a release tag also publishes them as a GitHub release. Releases are dated:
# 2026.11.03, and a later one the same day 2026.11.03.1, .2…
on:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

# one run per ref at a time: two pushes to main mustn't both rebuild nightly
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      CGO_CFLAGS_ALLOW: -fno-strict-overflow
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A release's notes are its section in CHANGELOG.md ("## [<tag>] - <date>"):
      # a tag without one fails here, before anything is built.
      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::no '## [$GITHUB_REF_NAME]' section: write the release's notes there before tagging"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev libpipewire-0.3-dev

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            v="$GITHUB_REF_NAME"
            # YYYY.MM.DD, a real date, then .N (1, 2…) for another release that day
            if ! [[ "$v" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(\.[1-9][0-9]*)?$ ]] ||
               [[ "$(date -ud "${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}" +%Y.%m.%d 2>/dev/null)" != "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" ]]; then
              echo "::error::tag $v is not a release version: YYYY.MM.DD or YYYY.MM.DD.N"
              exit 1
            fi
          else
            # between releases: today's date and the commit; ~ sorts before the release itself in dpkg
            v="$(date -u +%Y.%m.%d)~git$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go build -tags nox11 -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/desk ./cmd/desk

      - name: Check the version
        run: '[[ "$(dist/desk --version)" == "desk $VERSION" ]]'

      - name: .deb
        run: |
          root=dist/deb
          install -Dm755 dist/desk $root/usr/bin/desk
          install -Dm644 packaging/desk.desktop $root/usr/share/applications/desk.desktop
          install -Dm644 packaging/desk.svg $root/usr/share/icons/hicolor/scalable/apps/desk.svg
          install -Dm644 LICENSE $root/usr/share/doc/desk/copyright
          mkdir -p $root/DEBIAN
          cat > $root/DEBIAN/control <<EOF
          Package: desk
          Version: $VERSION
          Architecture: amd64
          Maintainer: Luis Felipe Domínguez Vega <ldominguezvega@gmail.com>
          Homepage: https://github.com/lfdominguez/desk
          Depends: libc6, libwayland-client0, libwayland-cursor0, libwayland-egl1, libegl1, libxkbcommon0
          Recommends: bubblewrap, openssh-client, libpipewire-0.3-0t64 | libpipewire-0.3-0
          Section: devel
          Priority: optional
          Description: A Kanban board where every card is a Claude Code session
           desk runs a Claude Code session per card, in its organization's folder and account,
           and tracks the pull requests, tickets, CI and alerts the work depends on.
          EOF
          dpkg-deb --root-owner-group --build $root "dist/desk_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}
          path: dist/*.deb

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "desk $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" dist/*.deb

      # Every push to main replaces the rolling "nightly" pre-release (and
      # moves its tag to this commit); dated tags stay the real releases.
      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "desk nightly ($VERSION)" \
            --notes "Built from main at $GITHUB_SHA. Replaced on every push; for a stable version take a dated release." \
            dist/*.deb

  # desk-<version>-x86_64.AppImage and its .zsync, built in Ubuntu 22.04 with X11 as well as
  # Wayland (no nox11: the AppImage catalog tests under Xvfb, and X11 sessions should open it
  # too). linuxdeploy bundles the libraries not on AppImage's excludelist (xkbcommon, Xcursor,
  # wayland-cursor/egl…); PipeWire is dlopened by the camera, so it isn't needed to start.
  # It also carries 22.04's glibc, which packaging/appimage/AppRun uses only on hosts with an
  # older one (appimage-old-glibc checks that on Ubuntu 20.04). Its update information points
  # AppImageUpdate at the latest release's .zsync (a nightly's at nightly's).
  appimage:
    needs: package
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.package.outputs.version }}
      CGO_CFLAGS_ALLOW: -fno-strict-overflow
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE in a container
    steps:
      - name: System libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git file gcc libc6-dev pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcursor-dev \
            libxfixes-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev libpipewire-0.3-dev librsvg2-bin \
            xvfb xauth x11-utils libegl-mesa0 libgl1-mesa-dri zsync

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/desk ./cmd/desk

      - name: Check the version and that PipeWire isn't linked
        run: |
          [ "$(dist/desk --version)" = "desk $VERSION" ]
          ! readelf -d dist/desk | grep -i pipewire

      - name: AppImage
        run: |
          # the icon must be a PNG: file managers and thumbnailers don't read SVG
          rsvg-convert -w 256 -h 256 packaging/desk.svg -o dist/desk.png
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy appimagetool
          app=dist/desk.AppDir
          # libGLESv2: Gio dlopens it (so linuxdeploy can't see it), and it isn't excludelisted:
          # hosts without libgles2 have libEGL and libGLdispatch, which it uses, still
          ./linuxdeploy --appdir $app -e dist/desk -d packaging/desk.desktop -i dist/desk.png \
            --custom-apprun packaging/appimage/AppRun -l /usr/lib/x86_64-linux-gnu/libGLESv2.so.2
          # glibc, for AppRun to use on older hosts (excludelisted, so linuxdeploy leaves it out)
          mkdir -p $app/usr/lib/glibc
          for l in ld-linux-x86-64.so.2 libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2 librt.so.1 \
            libresolv.so.2 libutil.so.1; do
            cp -L /lib/x86_64-linux-gnu/$l $app/usr/lib/glibc/
          done
          getconf GNU_LIBC_VERSION | cut -d' ' -f2 > $app/usr/lib/glibc/VERSION
          ln -s AppRun $app/desk # DESK_SELF: desk mcp, desk peer go through AppRun too
          release=latest
          [ "$GITHUB_REF_TYPE" = tag ] || release=nightly
          cd dist
          ARCH=x86_64 ../appimagetool -u "gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|$release|desk-*-x86_64.AppImage.zsync" \
            desk.AppDir "desk-${VERSION}-x86_64.AppImage"
          ls -l desk-*

      - name: Update information and the .zsync
        run: |
          # the runtime's .upd_info section (--appimage-updateinformation goes to desk under
          # APPIMAGE_EXTRACT_AND_RUN)
          readelf -p .upd_info "dist/desk-${VERSION}-x86_64.AppImage" | tee /dev/stderr | grep -q 'gh-releases-zsync|'
          [ -s "dist/desk-${VERSION}-x86_64.AppImage.zsync" ]

      # As the AppImage catalog checks it: X11 only, no network, a fresh home; and again with
      # the bundled glibc forced, as on an older host
      - name: Opens a window under X11
        run: |
          for forced in "" 1; do
            home=$(mktemp -d)
            DESK_BUNDLED_GLIBC=$forced HOME=$home XDG_CONFIG_HOME=$home/.config \
            XDG_DATA_HOME=$home/.local/share XDG_STATE_HOME=$home/.local/state \
            xvfb-run -a -s '-screen 0 1600x1000x24' sh packaging/appimage/check-window.sh dist/desk-*-x86_64.AppImage
          done

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync

  # The AppImage on a host older than its glibc (Ubuntu 20.04: glibc 2.31; Debian 11 has left
  # deb.debian.org): AppRun must run it through the bundled glibc, and desk run itself through AppRun.
  appimage-old-glibc:
    needs: [package, appimage]
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    env:
      VERSION: ${{ needs.package.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-appimage'
          path: dist
          merge-multiple: true

      # only what AppImage's excludelist expects from the host (no libgles2: the AppImage brings it)
      - name: Host libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth x11-utils libegl1 libegl-mesa0 \
            libgl1-mesa-dri libwayland-client0 libx11-6 libx11-xcb1 libxcb1

      - name: Runs, and runs itself
        run: |
          app="desk-${VERSION}-x86_64.AppImage"
          chmod +x "dist/$app"
          [ "$("./dist/$app" --version)" = "desk $VERSION" ]
          cd dist && "./$app" --appimage-extract >/dev/null
          [ "$(./squashfs-root/desk --version)" = "desk $VERSION" ]
          ls squashfs-root/usr/lib squashfs-root/usr/lib/glibc

      - name: Opens a window under X11
        run: |
          home=$(mktemp -d)
          HOME=$home XDG_CONFIG_HOME=$home/.config XDG_DATA_HOME=$home/.local/share XDG_STATE_HOME=$home/.local/state \
          xvfb-run -a -s '-screen 0 1600x1000x24' sh packaging/appimage/check-window.sh dist/desk-*-x86_64.AppImage

  # The AppImage and its .zsync, once both checks passed, added to the release (or nightly)
  # the package job made
  appimage-publish:
    needs: [appimage, appimage-old-glibc]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-appimage'
          path: dist
          merge-multiple: true

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" dist/*.AppImage dist/*.zsync

      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload -R "$GITHUB_REPOSITORY" nightly --clobber dist/*.AppImage dist/*.zsync

  # desk.app for macOS (universal: arm64 + x86_64) as desk-<version>-macos.zip, built by
  # packaging/macos/build-app.sh with the package job's version, then added to the release
  # (or nightly) that job made. Ad-hoc signed, so Gatekeeper asks on first open. With the
  # APPLE_* secrets it is signed with a Developer ID and notarized instead:
  #   APPLE_CERTIFICATE_P12       base64 of the "Developer ID Application" certificate (.p12)
  #   APPLE_CERTIFICATE_PASSWORD  that .p12's password
  #   APPLE_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
  #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  notarytool's login (an app-specific password)
  macos:
    needs: package
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.package.outputs.version }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Optional: only with the owner's Developer ID certificate
      - name: Signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "" "$kc"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$kc"
          # shellcheck disable=SC2046 # the search list is split on purpose: one keychain per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$APPLE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: desk.app
        run: packaging/macos/build-app.sh

      - name: Check the version
        run: '[[ "$(dist/desk.app/Contents/MacOS/desk --version)" == "desk $VERSION" ]]'

      # Optional: only with the certificate and notarytool's login; staples the ticket and zips again
      - name: Notarize
        if: env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        run: |
          zip="dist/desk-$VERSION-macos.zip"
          xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/desk.app
          rm "$zip"
          ditto -c -k --keepParent dist/desk.app "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-macos
          path: dist/*.zip

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip

      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly --clobber dist/*.zip

  # desk for Windows (amd64): desk-<version>-windows-amd64.zip (portable), cross-built on Linux by
  # packaging/windows/build.sh (Gio needs no cgo there) with the package job's version, then added
  # to the release (or nightly) that job made; the MSI's inputs go on to windows-msi. Unsigned, so
  # SmartScreen warns on first run. With these secrets desk.exe (here, osslsigncode) and the MSI
  # (there, signtool) are Authenticode-signed instead:
  #   WINDOWS_CERT_PFX       base64 of the code signing certificate with its key (.pfx)
  #   WINDOWS_CERT_PASSWORD  that .pfx's password
  windows:
    needs: package
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.package.outputs.version }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick zip osslsigncode

      # Optional: only with the owner's code signing certificate
      - name: Signing certificate
        if: env.WINDOWS_CERT_PFX != ''
        run: |
          echo "$WINDOWS_CERT_PFX" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          echo "SIGN_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          echo "SIGN_PASSWORD=$WINDOWS_CERT_PASSWORD" >> "$GITHUB_ENV"

      - name: desk.exe, zip and the MSI's inputs
        run: packaging/windows/build.sh

      - name: Check the version
        run: grep -qaF "$VERSION" dist/windows/desk.exe

      - name: Forget the certificate
        if: always() && env.WINDOWS_CERT_PFX != ''
        run: rm -f "$RUNNER_TEMP/cert.pfx"

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-windows
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-windows-msi-inputs
          path: dist/windows/msi

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip

      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly --clobber dist/*.zip

  # desk's MSI, on Windows: WiX v5's wizard (WixUI_Advanced) doesn't build elsewhere. From the
  # windows job's desk.exe and inputs by packaging/windows/msi.ps1; signed with the same secrets;
  # then installed silently (per user), checked and uninstalled before it's published.
  windows-msi:
    needs: [package, windows]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.package.outputs.version }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-windows-msi-inputs
          path: msi

      - name: WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: MSI
        run: ./msi/msi.ps1 "desk-$env:VERSION-windows-amd64.msi"

      # Optional: only with the owner's code signing certificate
      - name: Sign
        if: env.WINDOWS_CERT_PFX != ''
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          try {
            & $st.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /d desk `
              /tr http://timestamp.digicert.com /td sha256 "desk-$env:VERSION-windows-amd64.msi"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item $pfx }

      # As a user without the wizard would: per user, on the user's PATH, gone after uninstall
      - name: Try it
        run: |
          $msi = "desk-$env:VERSION-windows-amd64.msi"
          $p = Start-Process msiexec -ArgumentList '/i', $msi, '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode) { Get-Content install.log -Tail 80; exit $p.ExitCode }
          $exe = "$env:LOCALAPPDATA\Apps\desk\desk.exe"
          if (-not (Test-Path $exe)) {
            Select-String install.log -Pattern 'APPLICATIONFOLDER|ALLUSERS' | Select-Object -Last 20
            throw "desk.exe isn't in $exe"
          }
          if ([Environment]::GetEnvironmentVariable('PATH', 'User') -notlike '*Apps\desk*') { throw "not on the user's PATH" }
          $p = Start-Process msiexec -ArgumentList '/x', $msi, '/qn' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path $exe)) { throw "uninstall left $exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ env.VERSION }}-windows-msi
          path: desk-*.msi

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "desk-$env:VERSION-windows-amd64.msi" --repo "$env:GITHUB_REPOSITORY"

      - name: Nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly --clobber "desk-$env:VERSION-windows-amd64.msi" --repo "$env:GITHUB_REPOSITORY"

  # The AUR package desk-kanban, from packaging/aur/PKGBUILD with this tag's
  # version and source checksum. Needs the AUR_SSH_PRIVATE_KEY secret (the
  # key of the AUR account that maintains it); without it the job says so.
  aur:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version and checksum
        id: pkg
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::warning::no AUR_SSH_PRIVATE_KEY secret: the AUR package is not published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v="$GITHUB_REF_NAME"
          sum=$(curl -fsSL "https://github.com/lfdominguez/desk/archive/refs/tags/$v.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$v/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/PKGBUILD
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.pkg.outputs.publish == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: desk-kanban
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: Luis Felipe Domínguez Vega
          commit_email: ldominguezvega@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: desk ${{ github.ref_name }}
          updpkgsums: false

  # A release tag as a Sentry release with its commits, so desk's reports (release desk@<tag>)
  # name the commits that came with them; only given the SENTRY_AUTH_TOKEN secret and the
  # SENTRY_ORG and SENTRY_PROJECT repository variables.
  sentry:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Token
        id: token
        env:
          TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ORG: ${{ vars.SENTRY_ORG }}
          PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ -z "$TOKEN" || -z "$ORG" || -z "$PROJECT" ]]; then
            echo "::warning::no SENTRY_AUTH_TOKEN secret or SENTRY_ORG/SENTRY_PROJECT variable: no Sentry release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.publish == 'true'
        with:
          fetch-depth: 0 # set_commits reads the history since the last release

      - name: Release
        if: steps.token.outputs.publish == 'true'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: desk@${{ github.ref_name }}
          environment: production
          set_commits: auto
